<html lang="en">

<meta charset="utf-8">
<title>Periodic Table tests</title>
<style>
  body { font: 14px/1.5 ui-monospace, Consolas, monospace; margin: 1rem; background: #111; color: #ddd; }

<body>
<h1 id="summary">Running…</h1>
<pre id="out"></pre>
<script type="module">
import { ELEMENTS } from './js/elements.js';
import {
  CATEGORIES, PLACEHOLDERS, PREVIEW_AREA, placeOf, neighbour, shellsOf, findElements, temperature, density,
  configHtml, hasStandardWeight, byNumber, minus, yearText, stateOf,
} from './js/table.js';
import { checkAnswer, normalize, distance, SLIP_FROM } from './js/answers.js';
import {
  emptyProgress, loadProgress, record, levelOf, recordOf, isMastered, pickNext, weightOf, summarize, allMastered,
  addRound, dueList, nextDue, dayOf, dayText, MAX_ROUNDS, WEIGHTS, DUE_WEIGHT, MASTERED_WEIGHT, INTERVALS, TOP, FORMAT,
} from './js/progress.js';
import {
  SETS, poolOf, dueIn, newRound, nextQuestion, answerQuestion, roundOver, scoreOf, seeded, shuffled,
  choiceQuestion, promptOf, withArticle, WEIGHT_GAP, REVIEW_MOST,
} from './js/quiz.js';
import { shortMass } from './js/table.js';
import { SOUNDS, renderSound } from './js/sound.js';
import { createShow, advance, isOver } from './js/celebrate.js';

const results = [];
const notes = [];

// tests.html?only=data runs just the tests with that word before the colon.
const only = new URLSearchParams(location.search).get('only');
const wanted = name => !only || name.startsWith(`${only}:`);

function test(name, body) {
  if (!wanted(name)) return;
  try {
    body();
    results.push({ name, ok: true });
  } catch (error) {
    results.push({ name, ok: false, error: error.message });
  }
}

async function testAsync(name, body) {
  if (!wanted(name)) return;
  try {
    await body();
    results.push({ name, ok: true });
  } catch (error) {
    results.push({ name, ok: false, error: error.message });
  }
}

function equal(actual, expected, label = 'value') {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${label}: expected ${e}, got ${a}`);
}

function throws(body, label) {
  try {
    body();
  } catch {
    return;
  }
  throw new Error(`${label}: expected an error`);
}

const symbols = list => list.map(element => element.sym);

// ---- The data -----------------------------------------------------------------

test('data: 118 elements, numbered 1 to 118', () => {
  equal(ELEMENTS.length, 118, 'count');
  ELEMENTS.forEach((element, i) => equal(element.z, i + 1, element.sym));
});

test('data: symbols and names are all different', () => {
  equal(new Set(ELEMENTS.map(element => element.sym.toLowerCase())).size, 118, 'symbols');
  equal(new Set(ELEMENTS.map(element => element.name.toLowerCase())).size, 118, 'names');
});

test('data: a symbol is a capital and at most one small letter', () => {
  equal(symbols(ELEMENTS.filter(element => !/^[A-Z][a-z]?$/.test(element.sym))), []);
});

test('data: every series is one of the ten', () => {
  const keys = new Set(CATEGORIES.map(category => category.key));
  equal(symbols(ELEMENTS.filter(element => !keys.has(element.cat))), []);
});

test('data: series agree with the columns and rows', () => {
  for (const element of ELEMENTS) {
    const { group, row } = placeOf(element.z);
    const label = `${element.sym} (${element.cat})`;
    if (group === 1 && element.z !== 1) equal(element.cat, 'alkali', label);
    if (group === 2) equal(element.cat, 'alkaline', label);
    if (group >= 3 && group <= 12) equal(element.cat, 'transition', label);
    if (group === 17) equal(element.cat, 'halogen', label);
    if (group === 18) equal(element.cat, 'noble', label);
    if (row === 9) equal(element.cat, 'lanthanide', label);
    if (row === 10) equal(element.cat, 'actinide', label);
  }
  equal(symbols(ELEMENTS.filter(element => element.cat === 'metalloid')), ['B', 'Si', 'Ge', 'As', 'Sb', 'Te', 'Po'], 'metalloids');
  equal(symbols(ELEMENTS.filter(element => element.cat === 'nonmetal')), ['H', 'C', 'N', 'O', 'P', 'S', 'Se'], 'nonmetals');
});

test('data: the shells hold as many electrons as the atomic number', () => {
  equal(symbols(ELEMENTS.filter(element => shellsOf(element.config).reduce((a, b) => a + b, 0) !== element.z)), []);
});

test('data: configurations written shell by shell', () => {
  const order = 'spdf';
  for (const element of ELEMENTS) {
    const parts = element.config.replace(/^\[\w+\]/, '').split(' ').filter(Boolean);
    const keys = parts.map(part => Number(part[0]) * 10 + order.indexOf(part[1]));
    equal(keys, [...keys].sort((a, b) => a - b), element.sym);
  }
});

test('data: 84 standard weights; mass numbers for Tc, Pm and from Po, except Th, Pa and U', () => {
  const bracketed = ELEMENTS.filter(element => !hasStandardWeight(element)).map(element => element.z);
  const want = [43, 61, ...Array.from({ length: 35 }, (_, i) => 84 + i).filter(z => z < 90 || z > 92)];
  equal(bracketed, want);
  equal(ELEMENTS.filter(hasStandardWeight).length, 84, 'standard');
});

test('data: weights rise with the atomic number, apart from the known pairs', () => {
  const value = element => Number(element.mass.replace(/[[\]]/g, ''));
  const drops = [];
  for (let z = 2; z <= 118; z++) {
    if (value(byNumber(z)) < value(byNumber(z - 1))) drops.push(`${byNumber(z - 1).sym}/${byNumber(z).sym}`);
  }
  equal(drops, ['Ar/K', 'Co/Ni', 'Te/I', 'Th/Pa', 'U/Np', 'Pu/Am', 'Bh/Hs']);
});

test('data: some familiar weights', () => {
  const mass = sym => ELEMENTS.find(element => element.sym === sym).mass;
  equal(['H', 'C', 'O', 'Na', 'Cl', 'Fe', 'Cu', 'Au', 'Pb', 'U'].map(mass),
    ['1.008', '12.011', '15.999', '22.990', '35.45', '55.845', '63.546', '196.97', '207.2', '238.03']);
});

test('data: the eleven symbols that don\'t match their names say where they come from', () => {
  equal(symbols(ELEMENTS.filter(element => element.root)), ['Na', 'K', 'Fe', 'Cu', 'Ag', 'Sn', 'Sb', 'W', 'Au', 'Hg', 'Pb']);
});

test('data: every element has a name origin and a fact, each a sentence', () => {
  equal(symbols(ELEMENTS.filter(element => !/^[A-Z].{10,}\.$/.test(element.origin) || !/^[A-Z].{10,}\.$/.test(element.fact))), []);
});

test('data: other spellings', () => {
  equal(ELEMENTS.filter(element => element.also.length).map(element => [element.name, ...element.also]),
    [['Aluminum', 'Aluminium'], ['Sulfur', 'Sulphur'], ['Cesium', 'Caesium']]);
});

test('data: liquids, gases, and states only expected', () => {
  equal(symbols(ELEMENTS.filter(element => element.state === 'liquid')), ['Br', 'Hg'], 'liquids');
  equal(symbols(ELEMENTS.filter(element => element.state === 'gas' && !element.expected)),
    ['H', 'He', 'N', 'O', 'F', 'Ne', 'Cl', 'Ar', 'Kr', 'Xe', 'Rn'], 'gases');
  equal(ELEMENTS.filter(element => element.expected).map(element => element.z), [110, 111, 112, 113, 114, 115, 116, 117, 118], 'expected');
  equal(stateOf(byNumber(118)), 'unknown', 'Og');
});

// ---- The table ------------------------------------------------------------------

test('table: places', () => {
  equal(placeOf(1), { period: 1, group: 1, row: 1, column: 1, block: 's' }, 'H');
  equal(placeOf(2), { period: 1, group: 18, row: 1, column: 18, block: 's' }, 'He');
  equal(placeOf(5), { period: 2, group: 13, row: 2, column: 13, block: 'p' }, 'B');
  equal(placeOf(26), { period: 4, group: 8, row: 4, column: 8, block: 'd' }, 'Fe');
  equal(placeOf(56), { period: 6, group: 2, row: 6, column: 2, block: 's' }, 'Ba');
  equal(placeOf(57), { period: 6, group: null, row: 9, column: 3, block: 'f' }, 'La');
  equal(placeOf(71), { period: 6, group: null, row: 9, column: 17, block: 'f' }, 'Lu');
  equal(placeOf(72), { period: 6, group: 4, row: 6, column: 4, block: 'd' }, 'Hf');
  equal(placeOf(89), { period: 7, group: null, row: 10, column: 3, block: 'f' }, 'Ac');
  equal(placeOf(103), { period: 7, group: null, row: 10, column: 17, block: 'f' }, 'Lr');
  equal(placeOf(118), { period: 7, group: 18, row: 7, column: 18, block: 'p' }, 'Og');
});

test('table: every spot used once, and the pointer tiles and preview corner left free', () => {
  const spots = new Set();
  for (const element of ELEMENTS) {
    const { row, column } = placeOf(element.z);
    const key = `${row},${column}`;
    if (spots.has(key)) throw new Error(`${element.sym} on a taken spot`);
    spots.add(key);
  }
  for (const spot of PLACEHOLDERS) equal(spots.has(`${spot.row},${spot.column}`), false, spot.label);
  for (let row = PREVIEW_AREA.row; row < PREVIEW_AREA.row + PREVIEW_AREA.rows; row++) {
    for (let column = PREVIEW_AREA.column; column < PREVIEW_AREA.column + PREVIEW_AREA.columns; column++) {
      equal(spots.has(`${row},${column}`), false, `preview ${row},${column}`);
    }
  }
});

test('table: periods of 2, 8, 8, 18, 18, 32 and 32', () => {
  const counts = [0, 0, 0, 0, 0, 0, 0];
  for (const element of ELEMENTS) counts[placeOf(element.z).period - 1]++;
  equal(counts, [2, 8, 8, 18, 18, 32, 32]);
});

test('table: blocks', () => {
  const count = block => ELEMENTS.filter(element => placeOf(element.z).block === block).length;
  equal([count('s'), count('p'), count('d'), count('f')], [14, 36, 38, 30]);
});

test('table: the arrow keys\' neighbours', () => {
  equal(neighbour(1, 0, 1), 2, 'H →');
  equal(neighbour(2, 1, 0), 10, 'He ↓');
  equal(neighbour(4, 0, 1), 5, 'Be → over the gap');
  equal(neighbour(30, -1, 0), 30, 'Zn ↑ nothing');
  equal(neighbour(39, 1, 0), 57, 'Y ↓ over the pointers');
  equal(neighbour(57, -1, 0), 39, 'La ↑');
  equal(neighbour(57, 0, -1), 57, 'La ← nothing');
  equal(neighbour(71, 0, 1), 71, 'Lu → nothing');
  equal(neighbour(112, 1, 0), 66, 'Cn ↓ Dy');
  equal(neighbour(118, 0, 1), 118, 'Og → nothing');
});

test('table: shells', () => {
  equal(shellsOf('1s1'), [1], 'H');
  equal(shellsOf('[Ar]3d6 4s2'), [2, 8, 14, 2], 'Fe');
  equal(shellsOf('[Xe]4f14 5d10 6s1'), [2, 8, 18, 32, 18, 1], 'Au');
  equal(shellsOf(byNumber(118).config), [2, 8, 18, 32, 32, 18, 8], 'Og');
});

test('table: temperatures in °C and K', () => {
  equal(temperature(1811), '1538 °C (1811 K)', 'Fe');
  equal(temperature(13.81), '−259.34 °C (13.81 K)', 'H');
  equal(temperature(887, 'sublimes'), '614 °C (887 K), sublimes', 'As');
  equal(temperature(null), null, 'none');
});

test('table: densities, gases per litre', () => {
  equal(density(byNumber(1)), '0.0899 g/L', 'H');
  equal(density(byNumber(26)), '7.874 g/cm³', 'Fe');
  equal(density(byNumber(80)), '13.53 g/cm³', 'Hg');
  equal(density(byNumber(118)), null, 'Og');
});

test('table: weights to two decimals, rounded as a school table does', () => {
  const short = sym => shortMass(ELEMENTS.find(element => element.sym === sym));
  equal(['H', 'He', 'O', 'Mg', 'Si', 'Fe', 'Cu', 'Pb'].map(short), ['1.01', '4.00', '16.00', '24.31', '28.09', '55.85', '63.55', '207.20']);
});

test('table: writing', () => {
  equal(configHtml('[Ar]3d6 4s2'), '[Ar]3d<sup>6</sup> 4s<sup>2</sup>', 'configuration');
  equal(minus('+1, -1'), '+1, −1', 'minus');
  equal([yearText(0), yearText(1766)], ['Ancient times', '1766'], 'years');
});

// ---- Find -----------------------------------------------------------------------

test('find: a symbol first, then names that start the same', () => {
  equal(findElements('fe'), [26, 100], 'fe: iron, then fermium');
  equal(findElements('ca'), [20, 6, 48, 55, 98], 'ca');
  equal(findElements('  Ne '), [10, 60, 93], 'ne');
  equal(findElements('IRON'), [26], 'iron');
});

test('find: other spellings and numbers', () => {
  equal(findElements('caes'), [55], 'caesium');
  equal(findElements('sulph'), [16], 'sulphur');
  equal(findElements('79'), [79], '79');
  equal([findElements('0'), findElements('119'), findElements('xyz'), findElements('')], [[], [], [], []], 'none');
});

// ---- Answers --------------------------------------------------------------------

const verdict = (z, kind, typed) => checkAnswer(z, kind, typed).verdict;

test('answers: names, whatever the capitals, spaces and full stops', () => {
  equal([verdict(26, 'name', 'Iron'), verdict(26, 'name', ' IRON '), verdict(26, 'name', 'iron.')], ['right', 'right', 'right']);
  equal(verdict(1, 'name', 'Hydro gen'), 'right', 'a space inside');
  equal(normalize('Caesium‐ ’.'), 'caesium', 'normalize');
});

test('answers: both spellings where English has two', () => {
  equal([verdict(13, 'name', 'aluminium'), verdict(13, 'name', 'Aluminum')], ['right', 'right'], 'Al');
  equal([verdict(16, 'name', 'sulphur'), verdict(16, 'name', 'sulfur')], ['right', 'right'], 'S');
  equal([verdict(55, 'name', 'Caesium'), verdict(55, 'name', 'cesium')], ['right', 'right'], 'Cs');
});

test('answers: one slip forgiven in a long name, but not learned', () => {
  equal(verdict(42, 'name', 'Molybdenun'), 'slip', 'a letter wrong');
  equal(verdict(42, 'name', 'Molybednum'), 'slip', 'two swapped');
  equal(verdict(59, 'name', 'Praseodymum'), 'slip', 'a letter missing');
  equal(verdict(24, 'name', 'Chroomium'), 'slip', 'a letter extra');
  equal(verdict(13, 'name', 'Aluminiun'), 'slip', 'in the other spelling');
  equal(verdict(42, 'name', 'Molybedun'), 'wrong', 'two slips');
});

test(`answers: the slip only from ${SLIP_FROM} letters`, () => {
  equal(verdict(11, 'name', 'Sodum'), 'slip', 'Sodium, 6 letters');
  equal(verdict(18, 'name', 'Argom'), 'wrong', 'Argon, 5 letters');
  equal(verdict(26, 'name', 'Iorn'), 'wrong', 'Iron, 4 letters');
});

test('answers: another element\'s name is wrong, and says which', () => {
  equal(checkAnswer(58, 'name', 'Cesium'), { verdict: 'wrong', named: 55 }, 'Cesium for cerium');
  equal(checkAnswer(68, 'name', 'Terbium'), { verdict: 'wrong', named: 65 }, 'Terbium for erbium');
  equal(checkAnswer(96, 'name', 'Cerium'), { verdict: 'wrong', named: 58 }, 'Cerium for curium');
  equal(checkAnswer(29, 'name', 'co'), { verdict: 'wrong', named: 27 }, 'a symbol for a name');
  equal(checkAnswer(26, 'name', 'Fe'), { verdict: 'wrong', named: 26 }, 'its own symbol');
});

test('answers: symbols exactly, apart from capitals', () => {
  equal([verdict(26, 'symbol', 'Fe'), verdict(26, 'symbol', 'fe'), verdict(26, 'symbol', 'FE ')], ['right', 'right', 'right']);
  equal(checkAnswer(29, 'symbol', 'Co'), { verdict: 'wrong', named: 27 }, 'Co for copper');
  equal(checkAnswer(26, 'symbol', 'iron'), { verdict: 'wrong', named: 26 }, 'its name for its symbol');
  equal(checkAnswer(26, 'symbol', 'Fx'), { verdict: 'wrong', named: null }, 'no such symbol');
  equal(verdict(74, 'symbol', 'w'), 'right', 'W');
});

test('answers: nothing typed is not an answer', () => {
  equal([verdict(1, 'name', ''), verdict(1, 'symbol', '   ')], ['empty', 'empty']);
});

test('answers: edit distance', () => {
  equal([distance('abc', 'abc'), distance('abc', 'acb'), distance('abc', 'ab'), distance('kitten', 'sitting')], [0, 1, 1, 3]);
});

// ---- Progress -------------------------------------------------------------------

// A day number for the tests (see dayOf); any would do.
const DAY = 20000;

test('progress: right from new goes to 2, then up to Mastered at 4', () => {
  const progress = emptyProgress();
  equal(levelOf(progress, 'name', 26, DAY), 'new', 'new');
  equal(record(progress, 'name', 26, 'right', DAY), { before: 0, after: 2 }, 'first');
  equal(levelOf(progress, 'name', 26, DAY), 'learning', 'learning');
  record(progress, 'name', 26, 'right', DAY);
  equal(levelOf(progress, 'name', 26, DAY), 'almost', 'almost');
  record(progress, 'name', 26, 'right', DAY);
  equal(levelOf(progress, 'name', 26, DAY), 'mastered', 'mastered');
  equal(recordOf(progress, 'name', 26, DAY), { step: 4, right: 3, wrong: 0, slips: 0, due: DAY + 3, level: 'mastered' },
    'first review in 3 days');
});

test('progress: reviews come after 3 days, a week, a month, then every 3 months', () => {
  const progress = emptyProgress();
  for (let i = 0; i < 3; i++) record(progress, 'name', 26, 'right', DAY);
  equal(record(progress, 'name', 26, 'right', DAY + 1), { before: 4, after: 4 }, 'right before it is due only counts');
  equal(recordOf(progress, 'name', 26, DAY + 1).due, DAY + 3, 'the review day stays');
  equal(levelOf(progress, 'name', 26, DAY + 2), 'mastered', 'not due the day before');
  equal(levelOf(progress, 'name', 26, DAY + 3), 'due', 'due on the day');
  equal(levelOf(progress, 'name', 26, DAY + 40), 'due', 'and after');
  let day = DAY + 5; // two days late
  for (const [step, wait] of [[5, 7], [6, 30], [7, 90], [7, 90]]) {
    equal(record(progress, 'name', 26, 'right', day).after, step, `step ${step}`);
    equal(recordOf(progress, 'name', 26, day).due, day + wait, `step ${step}: next in ${wait} days`);
    day += wait;
  }
  equal(recordOf(progress, 'name', 26, day).right, 8, 'every answer counted');
  equal([TOP, INTERVALS[TOP]], [7, 90], 'the top step, every 3 months');
});

test('progress: wrong drops two steps, never below 1; still Mastered, it comes back sooner', () => {
  const progress = emptyProgress();
  equal(record(progress, 'name', 8, 'wrong', DAY), { before: 0, after: 1 }, 'new');
  record(progress, 'name', 8, 'right', DAY);
  record(progress, 'name', 8, 'right', DAY);
  record(progress, 'name', 8, 'right', DAY);
  equal(record(progress, 'name', 8, 'wrong', DAY), { before: 4, after: 2 }, 'from mastered');
  equal(recordOf(progress, 'name', 8, DAY).due, 0, 'no review while learning');
  equal(record(progress, 'name', 8, 'wrong', DAY), { before: 2, after: 1 }, 'to 1');
  progress.items.name[9] = [6, 5, 0, 0, 0, DAY];
  equal(record(progress, 'name', 9, 'wrong', DAY), { before: 6, after: 4 }, 'from 6, when due');
  equal(recordOf(progress, 'name', 9, DAY), { step: 4, right: 5, wrong: 1, slips: 0, due: DAY + 3, level: 'mastered' },
    'still mastered, back in 3 days');
});

test('progress: a slip scores but moves nothing up, and passes no review', () => {
  const progress = emptyProgress();
  equal(record(progress, 'name', 42, 'slip', DAY), { before: 0, after: 1 }, 'new becomes learning');
  record(progress, 'name', 42, 'right', DAY);
  equal(record(progress, 'name', 42, 'slip', DAY), { before: 2, after: 2 }, 'no change');
  equal(recordOf(progress, 'name', 42, DAY).slips, 2, 'counted');
  progress.items.name[43] = [5, 4, 0, 0, 0, DAY - 1];
  equal(record(progress, 'name', 43, 'slip', DAY), { before: 5, after: 5 }, 'a slip in a review');
  equal(recordOf(progress, 'name', 43, DAY).level, 'due', 'still due');
});

test('progress: each quiz keeps its own record', () => {
  const progress = emptyProgress();
  record(progress, 'name', 1, 'right');
  equal([levelOf(progress, 'name', 1), levelOf(progress, 'symbol', 1)], ['learning', 'new']);
});

test('progress: the next pick leaves out the last three', () => {
  const progress = emptyProgress();
  const random = seeded(3);
  for (let i = 0; i < 200; i++) equal(pickNext(progress, 'name', [1, 2, 3, 4], [9, 1, 2, 3], random), 4, `pick ${i}`);
  equal(pickNext(progress, 'name', [7], [7], random), 7, 'a pool of one');
  equal(pickNext(progress, 'name', [1, 2], [1], random), 2, 'a pool of two');
});

test('progress: picks lean towards what is being learned, and what is due', () => {
  const progress = emptyProgress();
  progress.items.name[1] = [5, 4, 0, 0, 0, DAY + 7]; // mastered
  progress.items.name[2] = [1, 0, 1, 0, 0, 0]; // learning
  progress.items.name[4] = [5, 4, 0, 0, 0, DAY]; // due today
  const weights = [1, 2, 3, 4].map(z => weightOf(progress, 'name', z, DAY));
  equal(weights, [MASTERED_WEIGHT, WEIGHTS[1], WEIGHTS[0], DUE_WEIGHT], 'weights');
  equal([WEIGHTS, DUE_WEIGHT, MASTERED_WEIGHT], [[3, 6, 4, 2], 5, 0.5], 'as planned');
  const random = seeded(11);
  const counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
  for (let i = 0; i < 4000; i++) counts[pickNext(progress, 'name', [1, 2, 3, 4], [], random, DAY)]++;
  const total = weights.reduce((sum, weight) => sum + weight, 0);
  [1, 2, 3, 4].forEach((z, i) => {
    const share = counts[z] / 4000;
    equal(Math.abs(share - weights[i] / total) < 0.03, true, `element ${z}: ${share.toFixed(3)}`);
  });
});

test('progress: set summaries', () => {
  const progress = emptyProgress();
  for (let i = 0; i < 3; i++) record(progress, 'symbol', 1, 'right', DAY);
  record(progress, 'symbol', 2, 'wrong', DAY);
  progress.items.symbol[5] = [6, 5, 0, 0, 0, DAY];
  equal(summarize(progress, 'symbol', [1, 2, 3, 4, 5], DAY), { new: 2, learning: 1, almost: 0, due: 1, mastered: 1 });
  equal([allMastered(progress, 'symbol', [1]), allMastered(progress, 'symbol', [1, 5]), allMastered(progress, 'symbol', [1, 2])],
    [true, true, false], 'due for review still counts as mastered');
  equal([isMastered(progress, 'symbol', 5), isMastered(progress, 'symbol', 2)], [true, false], 'isMastered');
});

test('progress: the reviews due, longest overdue first, and the next one', () => {
  const progress = emptyProgress();
  progress.items.name = {
    3: [4, 3, 0, 0, 0, DAY + 2],
    5: [6, 5, 0, 0, 0, DAY - 1],
    1: [4, 3, 0, 0, 0, DAY - 1],
    2: [5, 4, 0, 0, 0, DAY - 3],
    7: [3, 2, 0, 0, 0, 0],
    9: [7, 9, 0, 0, 0, DAY + 60],
  };
  equal(dueList(progress, 'name', DAY), [2, 1, 5], 'due today');
  equal(nextDue(progress, 'name', DAY), DAY + 2, 'the next');
  equal(dueList(progress, 'name', DAY + 2), [2, 1, 5, 3], 'two days on');
  equal(nextDue(progress, 'name', DAY + 60), 0, 'none after the last');
  equal(dueList(progress, 'symbol', DAY), [], 'another quiz');
  progress.items.weight = { 43: [4, 3, 0, 0, 0, DAY], 26: [4, 3, 0, 0, 0, DAY] };
  equal(dueIn(progress, 'weight', DAY), [26], 'only what the quiz asks about');
  equal(REVIEW_MOST, 20, 'at most 20 in a round');
});

test('progress: days are counted where you are', () => {
  const early = new Date(2026, 10, 8, 0, 5).getTime();
  const late = new Date(2026, 10, 8, 23, 55).getTime();
  equal(dayOf(late), dayOf(early), 'one day');
  equal(dayOf(new Date(2026, 10, 9, 0, 5).getTime()), dayOf(early) + 1, 'the next');
  // Across the clocks changing, in the US at least.
  equal(dayOf(new Date(2026, 2, 9, 12).getTime()) - dayOf(new Date(2026, 2, 7, 12).getTime()), 2, 'March');
  equal(dayOf(new Date(2026, 10, 2, 12).getTime()) - dayOf(new Date(2026, 9, 31, 12).getTime()), 2, 'November');
  const day = dayOf(early);
  equal([dayText(day, day), dayText(day, day - 1)], ['today', 'tomorrow'], 'near');
  equal(dayText(day, day - 5), new Date(2026, 10, 8).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), 'later');
});

test('quiz: weight questions offer four weights or elements, clear of each other', () => {
  const forms = { value: 0, pick: 0 };
  for (const seed of [1, 2, 3]) {
    const random = seeded(seed);
    for (const size of SETS) {
      const pool = poolOf('weight', size);
      for (const z of pool) {
        const question = choiceQuestion('weight', z, pool, random);
        const label = `${byNumber(z).sym} in 1-${size}`;
        const zs = question.options.map(option => option.z);
        equal(zs.length, 4, `${label}: four`);
        equal(new Set(zs).size, 4, `${label}: all different`);
        equal(zs[question.answer], z, `${label}: the answer`);
        equal(zs.every(other => pool.includes(other)), true, `${label}: from the set`);
        const weights = zs.map(other => Number(shortMass(byNumber(other))));
        for (let i = 0; i < 4; i++) {
          for (let j = i + 1; j < 4; j++) {
            if (Math.abs(weights[i] - weights[j]) < WEIGHT_GAP - 1e-9) throw new Error(`${label}: ${weights[i]} and ${weights[j]} too close`);
          }
        }
        const labels = question.options.map(option => option.label);
        if (question.form === 'value') equal(labels, weights.map(weight => weight.toFixed(2)), `${label}: weights shown`);
        else equal(labels, zs.map(other => byNumber(other).name), `${label}: names shown`);
        forms[question.form]++;
      }
    }
  }
  equal(forms.value > 100 && forms.pick > 100, true, `both ways: ${JSON.stringify(forms)}`);
});

test('quiz: series questions offer four series, or one element of the series among four', () => {
  const forms = { which: 0, pick: 0 };
  const keys = new Set(CATEGORIES.map(category => category.key));
  for (const seed of [4, 5, 6]) {
    const random = seeded(seed);
    for (const size of SETS) {
      const pool = poolOf('series', size);
      for (const z of pool) {
        const element = byNumber(z);
        const question = choiceQuestion('series', z, pool, random);
        const label = `${element.sym} in 1-${size}`;
        equal(question.options.length, 4, `${label}: four`);
        if (question.form === 'which') {
          const offered = question.options.map(option => option.key);
          equal(new Set(offered).size, 4, `${label}: four different series`);
          equal(offered.every(key => keys.has(key)), true, `${label}: real series`);
          equal(offered[question.answer], element.cat, `${label}: the answer`);
        } else {
          const zs = question.options.map(option => option.z);
          equal(new Set(zs).size, 4, `${label}: four different elements`);
          equal(zs.every(other => pool.includes(other)), true, `${label}: from the set`);
          equal(zs.filter(other => byNumber(other).cat === element.cat), [z], `${label}: only the answer in its series`);
          equal(zs[question.answer], z, `${label}: the answer`);
        }
        forms[question.form]++;
      }
    }
  }
  equal(forms.which > 100 && forms.pick > 100, true, `both ways: ${JSON.stringify(forms)}`);
});

test('quiz: how multiple-choice questions are put', () => {
  const asked = (quiz, z, form) => {

await testAsync('sound: every effect makes a sound of a sensible length', async () => {
  const seconds = { right: 0.8, slip: 0.6, wrong: 0.8, finish: 1, win: 6, firework: 1 };
  equal([...SOUNDS].sort(), Object.keys(seconds).sort(), 'the list');
  for (const name of SOUNDS) {
    const context = new OfflineAudioContext(1, Math.ceil(44100 * seconds[name]), 44100);
    renderSound(name, context, 0.01);
    const samples = (await context.startRendering()).getChannelData(0);
    let peak = 0;
    for (const sample of samples) peak = Math.max(peak, Math.abs(sample));
    let tail = 0;
    for (let i = Math.floor(samples.length * 0.95); i < samples.length; i++) tail = Math.max(tail, Math.abs(samples[i]));
    equal(peak > 0.01, true, `${name} is heard, peak ${peak}`);
    equal(peak <= 1.5, true, `${name} is not too loud, peak ${peak}`);
    if (name !== 'win') equal(tail < 0.01, true, `${name} has ended by ${seconds[name]} s, tail ${tail}`);
  }
});
